name: Commercial dependency remediation

on:
  push:
    branches: ['commercial/commercekit-prep']
    paths: ['.github/workflows/commercial-dependency-remediation.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    if: github.ref == 'refs/heads/commercial/commercekit-prep' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Apply non-breaking security updates within existing semver constraints
        run: npm audit fix || true  # audit fix exits 1 if unresolved dev-only advisories remain
      - name: Confirm production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Commit only dependency manifest updates when safe
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(commercial): update audited frontend dependencies"
            git push origin HEAD:commercial/commercekit-prep
          fi
